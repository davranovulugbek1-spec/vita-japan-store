
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita Japan Store</title>
<style>
:root {
  --green:#073d2d;
  --deep:#032b20;
  --gold:#e7c477;
  --cream:#fbf5e9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:#3b3024;
}
header {
  background:linear-gradient(120deg,var(--deep),var(--green));
  color:white;
  border-bottom:3px solid var(--gold);
}
.top {
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}
.logo {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:bold;
}
.tagline {font-size:12px;color:#f4e8c9}
.controls {display:flex;gap:8px}
.controls button {
  border:1px solid var(--gold);
  border-radius:25px;
  padding:10px 16px;
  background:transparent;
  color:white;
}
.controls button.active {
  background:var(--gold);
  color:var(--deep);
}
.banner img {
  display:block;
  width:100%;
  height:auto;
}
main {max-width:1200px;margin:auto;padding:22px 15px}
h2 {
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
}
.categories {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}
.category {
  min-height:125px;
  padding:13px 8px;
  border:1px solid #e3d0a9;
  border-radius:16px;
  background:#fffdf7;
  color:var(--green);
  font-weight:bold;
  box-shadow:0 4px 12px #00000012;
}
.category.active,.category:hover {
  background:var(--green);
  color:var(--gold);
}
.emoji {display:block;font-size:32px;margin-bottom:8px}
.uniqlo-logo {
  display:flex;
  align-items:center;
  justify-content:center;
  width:72px;
  height:72px;
  margin:0 auto 8px;
  background:#ed1c24;
  color:white;
  font-size:16px;
  font-weight:bold;
}
.search {
  width:100%;
  padding:15px 20px;
  border:1px solid #cbb78f;
  border-radius:30px;
  margin:25px 0;
  font-size:16px;
}
.products {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}
.product {
  background:white;
  border:1px solid #eadfc9;
  border-radius:16px;
  padding:13px;
  text-align:center;
}
.product img {
  width:100%;
  height:180px;
  object-fit:contain;
  background:#faf8f2;
  border-radius:10px;
}
.product h3 {color:var(--green)}
.product p {font-size:14px;color:#756957}
.price {font-weight:bold;color:#916b2e;margin:12px}
.action {
  background:var(--green);
  color:var(--gold);
  border:0;
  border-radius:25px;
  padding:12px 16px;
  cursor:pointer;
}
.product .action {width:100%}
.cart {
  margin:30px 0;
  background:white;
  padding:20px;
  border-radius:16px;
}
.cart-line {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.cart-line button {
  border:0;
  border-radius:12px;
  padding:5px 12px;
}
footer {
  text-align:center;
  padding:28px;
  background:var(--deep);
  color:#f5e5bd;
}
.empty {
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  background:white;
  border-radius:15px;
}
@media(max-width:800px) {
  .categories {grid-template-columns:repeat(3,minmax(0,1fr))}
  .products {grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px) {
  .top {justify-content:center;text-align:center}
  .categories {grid-template-columns:repeat(2,minmax(0,1fr))}
  .product img {height:135px}
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div>
      <div class="logo">✿ VITA JAPAN STORE 🇯🇵</div>
      <div class="tagline" id="tagline">Yapon mahsulotlari rasmiy do‘koni</div>
    </div>
    <div class="controls">
      <button id="uzButton" class="active" onclick="setLanguage('uz')">🇺🇿 UZ</button>
      <button id="ruButton" onclick="setLanguage('ru')">🇷🇺 RU</button>
      <button onclick="toggleCart()">🛒 <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<section class="banner">
  <img src="IMG_8861.webp" alt="Vita Japan Store kategoriyalari">
</section>

<main>
  <h2 id="categoriesTitle">Kategoriyalar</h2>
  <div class="categories" id="categories"></div>

  <input class="search" id="search"
    placeholder="Mahsulot nomini qidiring..."
    oninput="renderProducts()">

  <h2 id="productsTitle">Ommabop mahsulotlar</h2>
  <div class="products" id="products"></div>

  <section class="cart" id="cart" hidden>
    <h2 id="cartTitle">Savatcha</h2>
    <div id="cartItems"></div>
    <p><b id="totalLabel">Jami:</b> <span id="total">0 ¥</span></p>
    <button class="action" onclick="sendOrder()" id="orderButton">
      Telegram orqali buyurtma
    </button>
  </section>
</main>

<footer>
  <div class="logo">VITA JAPAN STORE</div>
  <p>Japan 🇯🇵 • Quality • Your Choice</p>
</footer>

<script>
const categories = [
 {id:"clothes",emoji:"👗",uz:"Ayollar va erkaklar kiyimlari",ru:"Женская и мужская одежда"},
 {id:"watches",emoji:"⌚",uz:"Brend soatlar",ru:"Брендовые часы"},
 {id:"cosmetics",emoji:"💄",uz:"Kosmetika",ru:"Косметика"},
 {id:"care",emoji:"🧴",uz:"Yuz va tana parvarishi",ru:"Уход за лицом и телом"},
 {id:"vitamins",emoji:"💊",uz:"Yapon vitaminlari",ru:"Японские витамины"},
 {id:"slimming",emoji:"🌿",uz:"Ozish",ru:"Похудение"},
 {id:"hair",emoji:"💇",uz:"Soch parvarishi",ru:"Уход за волосами"},
 {id:"hygiene",emoji:"🧼",uz:"Gigiyena",ru:"Гигиена"},
 {id:"kids",emoji:"🧸",uz:"Bolalar uchun",ru:"Для детей"},
 {id:"home",emoji:"🏠",uz:"Uy jihozlari",ru:"Товары для дома"}
];

const products = [
 {
  id:1,
  category:"vitamins",
  name:"Collagen C Jelly",
  desc:"Yapon kollagen jele mahsuloti",
  price:0,
  image:"BF981CA2-9BC7-4F26-876D-81785931E218.png"
 }
];

let language="uz";
let selected="all";
let cart=[];

function t(uz,ru) {
  return language==="uz" ? uz : ru;
}

function setLanguage(lang) {
  language=lang;
  document.getElementById("uzButton").classList.toggle("active",lang==="uz");
  document.getElementById("ruButton").classList.toggle("active",lang==="ru");
  document.documentElement.lang=lang;
  document.getElementById("tagline").textContent=
    t("Yapon mahsulotlari rasmiy do‘koni","Магазин японских товаров");
  document.getElementById("categoriesTitle").textContent=
    t("Kategoriyalar","Категории");
  document.getElementById("productsTitle").textContent=
    t("Ommabop mahsulotlar","Популярные товары");
  document.getElementById("cartTitle").textContent=
    t("Savatcha","Корзина");
  document.getElementById("totalLabel").textContent=
    t("Jami:","Итого:");
  document.getElementById("orderButton").textContent=
    t("Telegram orqali buyurtma","Заказать через Telegram");
  document.getElementById("search").placeholder=
    t("Mahsulot nomini qidiring...","Поиск товаров...");
  renderCategories();
  renderProducts();
  renderCart();
}

function renderCategories() {
  const box=document.getElementById("categories");
  box.innerHTML="";

  const all=document.createElement("button");
  all.className="category"+(selected==="all"?" active":"");
  all.innerHTML="<img src='barchasi-logo.png' alt='Vita Japan Store' style='width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 8px;'>"+t("Barchasi","Все товары");
  all.onclick=()=>{
    selected="all";
    renderCategories();
    renderProducts();
  };
  box.appendChild(all);

  categories.forEach(c=>{
    const b=document.createElement("button");
    b.className="category"+(selected===c.id?" active":"");

    if(c.id==="clothes") {
      b.innerHTML="<span class='uniqlo-logo'>UNIQLO</span>"+c[language];
    } else {
      b.innerHTML="<span class='emoji'>"+c.emoji+"</span>"+c[language];
    }

    b.onclick=()=>{
      selected=c.id;
      renderCategories();
      renderProducts();
    };
    box.appendChild(b);
  });
}

function renderProducts() {
  const box=document.getElementById("products");
  const query=document.getElementById("search").value.toLowerCase().trim();
  box.innerHTML="";

  const found=products.filter(p=>
    (selected==="all" || p.category===selected) &&
    (p.name.toLowerCase().includes(query) ||
     p.desc.toLowerCase().includes(query))
  );

  if(found.length===0) {
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent=t(
      "Bu kategoriyaga mahsulotlar tez orada qo‘shiladi.",
      "Товары в этой категории скоро появятся."
    );
    box.appendChild(empty);
    return;
  }

  found.forEach(p=>{
    const card=document.createElement("div");
    card.className="product";

    const img=document.createElement("img");
    img.src=p.image;
    img.alt=p.name;

    const title=document.createElement("h3");
    title.textContent=p.name;

    const desc=document.createElement("p");
    desc.textContent=p.desc;

    const price=document.createElement("div");
    price.className="price";
    price.textContent=p.price>0
      ? p.price.toLocaleString()+" ¥"
      : t("Narxni so‘rang","Уточняйте цену");

    const button=document.createElement("button");
    button.className="action";
    button.textContent=t("Savatchaga qo‘shish","Добавить в корзину");
    button.onclick=()=>addToCart(p.id);

    card.append(img,title,desc,price,button);
    box.appendChild(card);
  });
}

function addToCart(id) {
  const product=products.find(p=>p.id===id);
  const item=cart.find(p=>p.id===id);
  if(item) item.quantity++;
  else cart.push({...product,quantity:1});
  renderCart();
}

function renderCart() {
  const box=document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;
  let count=0;

  cart.forEach(item=>{
    total+=item.price*item.quantity;
    count+=item.quantity;

    const line=document.createElement("div");
    line.className="cart-line";

    const name=document.createElement("span");
    name.textContent=item.name+" × "+item.quantity;

    const remove=document.createElement("button");
    remove.textContent="−";
    remove.onclick=()=>{
      item.quantity--;
      if(item.quantity<=0) cart=cart.filter(x=>x.id!==item.id);
      renderCart();
    };

    line.append(name,remove);
    box.appendChild(line);
  });

  if(cart.length===0) {
    box.textContent=t("Savatcha bo‘sh","Корзина пуста");
  }

  document.getElementById("cartCount").textContent=count;
  document.getElementById("total").textContent=total.toLocaleString()+" ¥";
}

function toggleCart() {
  const box=document.getElementById("cart");
  box.hidden=!box.hidden;
  if(!box.hidden) box.scrollIntoView({behavior:"smooth"});
}

function sendOrder() {
  if(cart.length===0) {
    alert(t("Savatcha bo‘sh!","Корзина пуста!"));
    return;
  }

  const items=cart.map(p=>p.name+" x "+p.quantity).join("\n");
  const message=t(
    "Assalomu alaykum! Buyurtmam:\n",
    "Здравствуйте! Мой заказ:\n"
  )+items;

  const url="https://t.me/share/url?url="+
    encodeURIComponent("https://davranovulugbek1-spec.github.io/vita-japan-store/")+
    "&text="+encodeURIComponent(message);

  window.open(url,"_blank");
}

renderCategories();
renderProducts();
renderCart();
</script>
</body>
</html>
