
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita Japan Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff8fb;color:#333}
header{text-align:center;background:#f8c5dc;padding:30px}
header h1{color:#9b285b;margin:0}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:15px}
button{border:0;border-radius:22px;padding:12px 16px;background:#d94d8b;color:white;cursor:pointer}
.categories button{background:white;color:#9b285b;border:1px solid #e8b6ce}
.categories button.active{background:#d94d8b;color:white}
input{display:block;width:90%;max-width:500px;margin:20px auto;padding:13px;border:1px solid #e8b6ce;border-radius:22px}
h2{text-align:center;color:#9b285b}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:15px;max-width:1100px;margin:auto}
.product{background:white;border-radius:15px;padding:15px;text-align:center;box-shadow:0 3px 12px #0001}
.product img{width:100%;height:210px;object-fit:contain}
.price{font-weight:bold;margin:12px}
.cart{max-width:650px;margin:25px auto;background:white;padding:20px;border-radius:15px}
footer{text-align:center;padding:25px;background:#f8c5dc;color:#873052;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>🌸 Vita Japan Store</h1>
<p id="subtitle">Yaponiyaning sifatli mahsulotlari — siz uchun!</p>
</header>
<nav>
<button onclick="changeLang('uz')">O‘zbekcha</button>
<button onclick="changeLang('ru')">Русский</button>
<button onclick="showCart()">🛒 Savatcha (<span id="count">0</span>)</button>
</nav>
<input id="search" placeholder="Mahsulot qidirish..." oninput="render()">
<h2 id="catTitle">Mahsulot kategoriyalari</h2>
<nav class="categories" id="categories"></nav>
<h2 id="prodTitle">Mahsulotlar</h2>
<div class="products" id="products"></div>
<div class="cart" id="cart" hidden>
<h2>Savatcha</h2>
<div id="cartItems">Savatcha bo‘sh</div>
<button onclick="order()">Telegram orqali buyurtma</button>
</div>
<footer>Vita Japan Store 🇯🇵</footer>
<script>
const cats=[
{id:"clothes",uz:"Ayollar va erkaklar kiyimlari",ru:"Женская и мужская одежда"},
{id:"watches",uz:"Brend soatlar",ru:"Брендовые часы"},
{id:"cosmetics",uz:"Yapon kosmetikasi",ru:"Японская косметика"},
{id:"care",uz:"Yuz va tana parvarishi",ru:"Уход за лицом и телом"},
{id:"vitamins",uz:"Yapon vitaminlari",ru:"Японские витамины"}
];
const products=[
{id:1,cat:"vitamins",name:"Collagen C Jelly",desc:"Yapon kollagen jele mahsuloti",price:0,img:"BF981CA2-9BC7-4F26-876D-81785931E218.png"}
];
let lang="uz",selected="all",cart=[];
function changeLang(l){
lang=l;
document.getElementById("subtitle").textContent=l==="uz"?"Yaponiyaning sifatli mahsulotlari — siz uchun!":"Качественные товары из Японии — для вас!";
document.getElementById("catTitle").textContent=l==="uz"?"Mahsulot kategoriyalari":"Категории товаров";
document.getElementById("prodTitle").textContent=l==="uz"?"Mahsulotlar":"Товары";
renderCats();render();
}
function renderCats(){
const el=document.getElementById("categories");el.innerHTML="";
const all=document.createElement("button");
all.textContent=lang==="uz"?"Barchasi":"Все товары";
all.className=selected==="all"?"active":"";
all.onclick=()=>{selected="all";renderCats();render()};
el.appendChild(all);
cats.forEach(c=>{
const b=document.createElement("button");b.textContent=c[lang];
b.className=selected===c.id?"active":"";
b.onclick=()=>{selected=c.id;renderCats();render()};
el.appendChild(b);
});
}
function render(){
const el=document.getElementById("products");el.innerHTML="";
const q=document.getElementById("search").value.toLowerCase();
const list=products.filter(p=>(selected==="all"||p.cat===selected)&&p.name.toLowerCase().includes(q));
if(!list.length){el.textContent=lang==="uz"?"Bu kategoriyaga mahsulotlar tez orada qo‘shiladi.":"Товары этой категории скоро появятся.";return}
list.forEach(p=>{
const card=document.createElement("div");card.className="product";
const img=document.createElement("img");img.src=p.img;img.alt=p.name;
const title=document.createElement("h3");title.textContent=p.name;
const desc=document.createElement("p");desc.textContent=p.desc;
const price=document.createElement("div");price.className="price";price.textContent=p.price?p.price+" ¥":(lang==="uz"?"Narxni so‘rang":"Уточняйте цену");
const btn=document.createElement("button");btn.textContent=lang==="uz"?"Savatchaga qo‘shish":"В корзину";
btn.onclick=()=>add(p);
card.append(img,title,desc,price,btn);el.appendChild(card);
});
}
function add(p){let x=cart.find(i=>i.id===p.id);if(x)x.qty++;else cart.push({...p,qty:1});document.getElementById("count").textContent=cart.reduce((s,i)=>s+i.qty,0);renderCart()}
function showCart(){document.getElementById("cart").hidden=!document.getElementById("cart").hidden;renderCart()}
function renderCart(){const el=document.getElementById("cartItems");el.innerHTML="";if(!cart.length){el.textContent="Savatcha bo‘sh";return}cart.forEach(i=>{const p=document.createElement("p");p.textContent=i.name+" × "+i.qty;el.appendChild(p)})}
function order(){if(!cart.length){alert("Savatcha bo‘sh!");return}const msg="Assalomu alaykum! Buyurtmam:\n"+cart.map(i=>i.name+" x "+i.qty).join("\n");window.open("https://t.me/share/url?text="+encodeURIComponent(msg),"_blank")}
renderCats();render();
</script>
</body>
</html>
